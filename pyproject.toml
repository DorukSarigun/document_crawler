[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "document-crawler"
version = "0.1.0"
description = "Sniff, parse, and recursively extract nested document content."
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "pytesseract>=0.3",
    "typer>=0.12",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["document_crawler*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
